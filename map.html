<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Every way to invest, on one map · Wyndton</title>
<meta name="description" content="All ways to invest in twelve groups, filtered by how much you can put in and by risk.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<script src="data/catalog.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/core.js"></script>
</head>
<body>
<div id="top"></div>
<main class="wrap">
  <section style="padding:36px 0 28px;display:flex;flex-direction:column;gap:18px">
    <h1 class="h2" style="font-size:40px">Every way to invest, <span class="acc">on one map</span></h1>
    <p class="lead" style="max-width:720px">From a savings account to a hedge fund seat. Each entry shows what it takes to get in, how risky it is and how hard it is to get out. Enter your budget to see what is open to you.</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      <form class="amount" id="amt-form" style="max-width:none;flex:0 1 auto">
        <label for="amt" class="amt-label">I can put in</label><label style="flex:0 1 auto;border-radius:999px;height:44px"><input id="amt" type="text" inputmode="numeric" placeholder="$ amount" style="width:110px" aria-label="Amount in US dollars"></label>
      </form>
      <div class="pills" id="budget" role="group" aria-label="Budget"></div>
      <div class="pills" id="risk" role="group" aria-label="Risk" style="margin-left:8px"></div>
      <span class="mono note" id="count" style="margin-left:auto"></span>
    </div>
  </section>
  <section class="sec" id="groups" style="display:flex;flex-direction:column;gap:36px"></section>
</main>
<script>
(function () {
  var K = window.K, C = K.C, esc = K.esc;
  K.header('map');
  var LIMIT = { 1: 100, 2: 1000, 3: 25000, 4: 250000 };   // smallest budget per entry level
  var LABEL = { 1: 'from $100', 2: 'from $1k', 3: 'from $25k', 4: 'from $250k' };
  var legacy = { 1: 100, 2: 1000, 3: 25000, 4: 250000 }[K.q('b')];
  var amount = parseFloat((K.q('a') || '').replace(/[^0-9.]/g, '')) || legacy || null, risk = K.q('r') || 'all';
  function tip(w, k) { var r = w.ratings && w.ratings[k]; return r ? (r.source === 'editorial' ? 'Editorial estimate: ' : 'From ' + r.source + ' data: ') + r.basis : ''; }
  function est(w, k) { var r = w.ratings && w.ratings[k]; return r && r.source === 'editorial' ? ' <span class="est" title="editorial estimate">est.</span>' : ''; }
  function open(w) { return !amount || LIMIT[w.entry] <= amount; }
  function draw() {
    document.getElementById('amt').value = amount ? amount.toLocaleString('en-US') : '';
    document.getElementById('budget').innerHTML = [[100, '$100'], [1000, '$1,000'], [10000, '$10,000'], [50000, '$50,000+'], [null, 'Show everything']].map(function (p) {
      return '<button class="pill" aria-pressed="' + (p[0] === amount) + '" data-a="' + (p[0] || '') + '">' + p[1] + '</button>'; }).join('');
    document.getElementById('risk').innerHTML = [['all', 'Any risk'], ['low', 'Low'], ['medium', 'Medium'], ['high', 'High']].map(function (p) {
      return '<button class="pill" aria-pressed="' + (p[0] === risk) + '" data-r="' + p[0] + '">' + p[1] + '</button>'; }).join('');
    var shown = 0;
    document.getElementById('groups').innerHTML = C.groups.map(function (g) {
      var all = C.ways.filter(function (w) { return w.group === g.slug; });
      var ws = all.filter(function (w) { return open(w) && (risk === 'all' || w.risk === risk); });
      shown += ws.length;
      return '<div><div class="grp-h"><a class="h3" href="class.html?g=' + g.slug + '">' + esc(g.name) + '</a><span class="mono acc" style="font-size:13px">' + ws.length + ' of ' + all.length + '</span><span class="note" style="font-size:14px">' + esc(g.note) + '</span></div>' +
        (ws.length ? '<div class="wgrid">' + ws.map(function (w) {
          var m = w.metrics, fig = m.ret_1y || m.ret_5y || m.ret_10y || m.yield;
          var figTxt = fig && K.num(fig.value) ? K.pctc(fig.value) + ' <span class="muted" style="font-size:11px">' + (fig === m.ret_1y ? '1y' : fig === m.ret_5y ? '5y/yr' : fig === m.ret_10y ? '10y/yr' : 'yield') + '</span>' : '<span class="nodata"></span>';
          return '<a class="wcard" href="' + K.wayHref(w) + '"><span class="whead">' + K.ini({ way: w.name, group: w.group, id: w.slug, name: w.name, waySlug: w.slug }) + '<span class="nm">' + esc(w.name) + '</span></span>' +
            '<span class="row"><span class="' + (w.risk === 'high' ? 'down' : '') + '" title="' + esc(tip(w, 'risk')) + '">' + w.risk + ' risk' + est(w, 'risk') + '</span><span class="mono" title="' + esc(fig && fig.source ? fig.source + ' · ' + (fig.asof || '') : '') + '">' + figTxt + '</span></span>' +
            '<span class="row"><span class="mono" style="color:var(--text)" title="' + esc(tip(w, 'entry')) + '">' + LABEL[w.entry] + est(w, 'entry') + '</span><span title="' + esc(tip(w, 'liq')) + '">exit <span class="exitbar" aria-hidden="true"><i style="width:' + (w.liq * 20) + '%"></i></span> <span class="mono">' + w.liq + '/5</span>' + est(w, 'liq') + '</span></span></a>';
        }).join('') + '</div>' : '<div class="note">Nothing here for this budget and risk.</div>') + '</div>';
    }).join('');
    document.getElementById('count').textContent = shown + ' of ' + C.ways.length + ' open to you';
    document.querySelectorAll('[data-a]').forEach(function (b) { b.onclick = function () { amount = b.dataset.a ? +b.dataset.a : null; sync(); }; });
    document.querySelectorAll('[data-r]').forEach(function (b) { b.onclick = function () { risk = b.dataset.r; sync(); }; });
  }
  function sync() {
    var q = []; if (amount) q.push('a=' + amount); if (risk !== 'all') q.push('r=' + risk);
    history.replaceState(null, '', q.length ? '?' + q.join('&') : location.pathname); draw();
  }
  document.getElementById('amt-form').onsubmit = function (e) { e.preventDefault(); var v = parseFloat(document.getElementById('amt').value.replace(/[^0-9.]/g, '')); amount = v > 0 ? v : null; sync(); };
  document.getElementById('amt').onchange = function () { document.getElementById('amt-form').onsubmit(new Event('submit')); };
  draw();
  K.footer();
})();
</script>
</body>
</html>
