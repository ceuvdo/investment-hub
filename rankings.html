<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cross-asset rankings</title>
<meta name="description" content="Every tracked asset ranked by return, risk and liquidity on the same scale.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<script src="data/catalog.js"></script>
<script src="assets/js/core.js"></script>
</head>
<body>
<div id="top"></div>
<main class="wrap">
  <section style="padding:28px 0 24px;display:flex;flex-direction:column;gap:18px">
    <h1 class="h2" style="font-size:36px">Cross-asset rankings</h1>
    <p class="lead">Every asset with a live price, on the same scale. Click a column to sort. House prices are indexes, not prices you can pay.</p>
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
      <div class="pills" id="pills"></div>
      <input id="f" type="search" class="btn" placeholder="Filter by name or ticker" style="font-weight:400;min-width:240px">
    </div>
  </section>
  <section class="sec"><div class="card" style="overflow:hidden"><div id="rank"></div>
    <div class="tbl-foot"><span class="note" id="src"></span><a class="link" href="data/catalog.json" download>Download data (JSON)</a></div></div></section>
</main>
<script>
(function () {
  var K = window.K, C = K.C, esc = K.esc;
  K.header('rank');
  var grp = K.q('g') || 'all', f = '', state = { sort: 'ret_1y', dir: -1 };
  function draw() {
    document.getElementById('pills').innerHTML = [['all', 'All', C.assets.length]].concat(C.groups.map(function (g) { return [g.slug, g.name, C.assets.filter(function (a) { return a.group === g.slug; }).length]; })).filter(function (p) { return p[2]; })
      .map(function (p) { return '<button class="pill" aria-pressed="' + (p[0] === grp) + '" data-g="' + p[0] + '">' + esc(p[1]) + ' <span class="n">' + p[2] + '</span></button>'; }).join('');
    document.querySelectorAll('[data-g]').forEach(function (b) { b.onclick = function () { grp = b.dataset.g; history.replaceState(null, '', grp === 'all' ? '?' : '?g=' + grp); draw(); }; });
    var rows = C.assets.filter(function (a) { return (grp === 'all' || a.group === grp) && (!f || (a.name + ' ' + a.symbol + ' ' + a.way + ' ' + a.sub).toLowerCase().indexOf(f) >= 0); });
    K.rankTable(document.getElementById('rank'), rows, state);
  }
  document.getElementById('f').oninput = function (e) { f = e.target.value.toLowerCase().trim(); draw(); };
  draw();
  document.getElementById('src').textContent = 'Yahoo Finance (prices, dividends reinvested), BIS via FRED (house prices). Built ' + C.meta.built + '. 5y and 10y returns are per year.';
  K.footer();
})();
</script>
</body>
</html>
