<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>News that moves prices · Wyndton</title>
<meta name="description" content="Market headlines from CNBC, Cointelegraph and Investing.com, with the prices of the assets they may move.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<script src="data/catalog.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/core.js"></script>
</head>
<body>
<div id="top"></div>
<div class="wrap" style="padding:0"><div class="crumbs" id="crumbs"><a href="index.html">Home</a> / <span>News</span></div></div>
<main class="wrap sec" id="main"><div class="empty">Loading headlines…</div></main>
<script>
(function () {
  var K = window.K, esc = K.esc;
  K.header('news');
  var url = K.q('u');
  function moreList(items, skip) {
    return items.filter(function (n) { return n.url !== skip; }).slice(0, 8).map(function (n) {
      return '<a class="card" href="' + K.newsHref(n) + '" style="padding:14px 16px;display:flex;flex-direction:column;gap:4px"><span class="note">' + esc(n.cat) + ' · ' + esc(K.ago(n.ts)) + '</span><span style="font-weight:600;line-height:1.3">' + esc(n.t) + '</span></a>';
    }).join('');
  }
  K.loadNews().then(function (items) {
    var main = document.getElementById('main');
    var n = url ? items.filter(function (x) { return x.url === url; })[0] : null;
    if (!n) {
      // all news
      main.innerHTML = '<h1 class="h2" style="font-size:36px;margin:8px 0 6px">News that moves prices</h1><p class="lead" style="margin:0 0 24px">Latest headlines from CNBC, Cointelegraph and Investing.com, refreshed every 10 minutes. Each one opens with the prices of the assets it may move.</p>' +
        (url ? '<p class="disclaimer">That story has dropped out of the latest headlines. <a class="link" href="' + (K.safeUrl(url) ? esc(url) : '#') + '" target="_blank" rel="noopener">Open it at the publisher →</a></p>' : '') +
        '<div class="news-grid" id="ng"></div><div style="text-align:center;margin-top:20px"><button class="btn" id="more-news">Show more</button></div>';
      var shown = 12;
      var paint = function () { document.getElementById('ng').innerHTML = items.slice(0, shown).map(K.newsCard).join(''); document.getElementById('more-news').hidden = shown >= items.length; };
      document.getElementById('more-news').onclick = function () { shown += 12; paint(); };
      paint();
      return;
    }
    document.title = n.t + ' · Wyndton';
    document.getElementById('crumbs').innerHTML = '<a href="index.html">Home</a> / <a href="news.html">News</a> / <span>' + esc(n.cat) + '</span>';
    var rel = K.related(n, 5);
    var h = '<article class="story">' +
      '<span class="mono note" style="text-transform:uppercase;letter-spacing:.08em">' + esc(n.cat) + ' · ' + esc(K.ago(n.ts)) + '</span>' +
      '<h1 class="h2" style="font-size:36px;line-height:1.15;margin:0">' + esc(n.t) + '</h1>' +
      '<img class="story-img" src="' + esc(K.newsImg(n)) + '" alt="" referrerpolicy="no-referrer" onerror="this.remove()">' +
      ((n.ours || n.sum) ? '<p class="lead" style="margin:0">' + esc(n.ours || n.sum) + '</p>' : '') +
      '<span class="note story-src">Source: <a class="link" href="' + (K.safeUrl(n.url) ? esc(n.url) : '#') + '" target="_blank" rel="noopener">' + esc(n.src) + '</a></span>' +
      (rel.length ? '<div class="card" style="overflow:hidden"><div class="pad" style="padding-bottom:12px"><h2 class="h4">What it may move</h2></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th class="l">Asset</th><th>Price</th><th>30 days</th><th>1 year</th><th>Swing</th></tr></thead><tbody>' + rel.map(function (a) {
        return '<tr><td><div class="asset-cell">' + K.ini(a) + '<div><a href="' + K.assetHref(a) + '">' + esc(a.name) + '</a><small>' + esc(a.way) + '</small></div></div></td><td data-lp="' + a.id + '">' + K.money(a.price, a.currency) + '</td><td>' + K.pctc(a.chg_30d) + '</td><td>' + K.pctc(a.ret_1y) + '</td><td>' + (K.num(a.swing) ? a.swing.toFixed(0) + '%' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div></div>' : '') +
      '</article>' +
      '<section class="sec"><div class="sec-h"><h2 class="h3">More news</h2><div style="display:flex;gap:8px;align-items:center"><a class="link" href="news.html">All news →</a>' +
      '<button class="btn sm news-nav" id="more-prev" aria-label="Previous">‹</button><button class="btn sm news-nav" id="more-next" aria-label="Next">›</button></div></div>' +
      '<div class="news-strip" id="more-strip"></div></section>';
    main.innerHTML = h;
    // more news: horizontal strip with arrows, same as the home page
    var more = items.filter(function (x) { return x.url !== n.url; }).slice(0, 12), mp = 0;
    var strip = document.getElementById('more-strip');
    function maxMp() { var c = strip.querySelector('.news-card'); if (!c) return 0; var per = Math.max(1, Math.floor((strip.clientWidth + 16) / (c.getBoundingClientRect().width + 16))); return Math.max(0, more.length - per); }
    function drawMore() {
      strip.innerHTML = '<div class="news-track">' + more.map(K.newsCard).join('') + '</div>';
      var c = strip.querySelector('.news-card'); if (c) strip.firstChild.style.transform = 'translateX(' + (-mp * (c.getBoundingClientRect().width + 16)) + 'px)';
      document.getElementById('more-prev').disabled = mp <= 0; document.getElementById('more-next').disabled = mp >= maxMp();
    }
    document.getElementById('more-prev').onclick = function () { mp = Math.max(0, mp - 1); drawMore(); };
    document.getElementById('more-next').onclick = function () { mp = Math.min(maxMp(), mp + 1); drawMore(); };
    drawMore();
  }).catch(function () {
    document.getElementById('main').innerHTML = '<div class="empty">Headlines are unavailable right now.</div>';
  });
  K.footer();
})();
</script>
</body>
</html>
