name: Refresh data

on:
  schedule:
    - cron: "15 6 * * *"   # every day 06:15 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data
        run: python pipeline/build_data.py --fresh
      - name: Commit if changed
        run: |
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh market data $(date -u +%Y-%m-%d)"
          git push
